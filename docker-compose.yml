services:

  ai:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: emojudge-ai
    ports:
      - "8000:8000"

  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: emojudge-web
    ports:
      - "5000:5000"
    environment:
      FASTAPI_URL: http://ai:8000
    depends_on:
      - ai