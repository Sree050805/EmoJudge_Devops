<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoJudge – Sign Up</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: gold; font-family: Arial, sans-serif;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1a1a1a; border: 1px solid rgba(255,215,0,.3); border-radius: 12px;
            padding: 40px 36px; width: 100%; max-width: 400px; }
    h1 { text-align: center; font-size: 24px; letter-spacing: 3px; margin-bottom: 6px; }
    .sub { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 28px; }
    input { width: 100%; background: #111; color: white; border: 1px solid rgba(255,215,0,.4);
            border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; outline: none; }
    input:focus { border-color: gold; }
    input::placeholder { color: #555; }
    button { width: 100%; background: gold; color: black; border: none; border-radius: 8px;
             padding: 13px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
    button:hover { background: #e6c200; }
    .error { color: #ff4444; font-size: 13px; margin-bottom: 12px; text-align: center; }
    .login-link { text-align: center; margin-top: 18px; font-size: 13px; color: #aaa; }
    .login-link a { color: gold; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚖ EMOJUDGE</h1>
    <p class="sub">Create your attorney account</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="text" name="attorney_id" placeholder="Attorney ID" required/>
      <input type="email" name="email" placeholder="Email Address" required/>
      <input type="password" name="password" placeholder="Password" required/>
      <button type="submit">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/">Login</a>
    </div>
  </div>
</body>
</html>
