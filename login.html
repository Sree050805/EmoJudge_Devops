<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmoJudge - Attorney Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #121212;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            text-align: center;
        }


        /* Project Title */

        .title {
            color: gold;

            font-size: 28px;
            font-weight: bold;

            margin-bottom: 10px;

            text-shadow:
                2px 2px 4px
                rgba(255,255,255,0.5);
        }


        /* Welcome Message */

        .welcome-message {
            color: gold;

            font-size: 16px;

            margin-bottom: 20px;

            max-width: 440px;

            line-height: 1.4;
        }


        /* Login Box */

        .login-container {
            background:
                rgba(255,255,255,0.15);

            padding: 28px;

            border-radius: 10px;

            text-align: center;

            box-shadow:
                0 4px 10px
                rgba(255,255,255,0.3);

            width: 350px;

            max-width: 100%;
        }


        h2 {
            color: peachpuff;

            margin-top: 0;
            margin-bottom: 20px;

            text-shadow:
                1px 1px 3px
                rgba(255,255,255,0.7);
        }


        form {
            width: 100%;
        }


        label {
            color: white;

            font-weight: bold;

            display: block;

            margin-top: 10px;
            margin-bottom: 5px;
        }


        /* Input Fields */

        input {
            display: block;

            width: 100%;

            padding: 10px 12px;

            margin: 0 0 12px 0;

            border:
                2px solid lavender;

            border-radius: 5px;

            background:
                rgba(255,255,255,0.2);

            color: white;

            font-size: 16px;
        }


        input::placeholder {
            color:
                rgba(255,255,255,0.7);
        }


        /* Password */

        .password-container {
            position: relative;

            width: 100%;
        }


        .password-container input {
            padding-right: 42px;
        }


        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            cursor: pointer;

            color: white;

            user-select: none;
        }


        /* Login Button */

        button {
            width: 100%;

            padding: 10px;

            margin-top: 4px;

            background-color: gold;

            color: black;

            font-weight: bold;

            border: none;

            border-radius: 5px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s ease-in-out;
        }


        button:hover {
            background-color: #E0E7FF;

            transform: scale(1.02);
        }


        /* Links */

        .forgot-password {
            display: block;

            color: white;

            margin-top: 12px;

            text-decoration: none;

            font-size: 14px;
        }


        .forgot-password:hover {
            color: gold;

            text-decoration: underline;
        }


        .signup-link {
            display: block;

            margin-top: 12px;

            color: lightblue;

            text-decoration: none;

            font-size: 14px;
        }


        .signup-link:hover {
            color: gold;

            text-decoration: underline;
        }


        /* Error */

        .error-message {
            color: #ff4d4d;

            font-size: 14px;

            font-weight: bold;

            margin-top: 14px;
            margin-bottom: 0;
        }

    </style>
</head>


<body>

    <div class="title">
        EMOJUDGE
    </div>


    <p class="welcome-message">

        Welcome to EmoJudge, the AI-powered emotion
        analysis platform designed for legal professionals.

        Log in to analyze witness testimonies and gain
        deeper insights into case dynamics.

    </p>


    <div class="login-container">

        <h2>
            Attorney Login
        </h2>


        <form
            action="/"
            method="POST"
        >

            <label for="attorney_id">
                Attorney ID
            </label>


            <input
                type="text"
                id="attorney_id"
                name="attorney_id"
                placeholder="Enter your ID"
                required
            >


            <label for="password">
                Password
            </label>


            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <span
                    class="toggle-password"
                    onclick="togglePassword()"
                >
                    👁
                </span>

            </div>


            <button type="submit">
                Login
            </button>


            <a
                href="{{ url_for('forgot_password') }}"
                class="forgot-password"
            >
                Forgot Password?
            </a>


            <a
                href="/signup"
                class="signup-link"
            >
                New here? Create an account
            </a>


            {% if error %}

            <p class="error-message">
                {{ error }}
            </p>

            {% endif %}

        </form>

    </div>


    <script>

        function togglePassword() {

            const passwordField =
                document.getElementById(
                    "password"
                );

            passwordField.type =
                passwordField.type === "password"
                    ? "text"
                    : "password";
        }

    </script>

</body>

</html>
