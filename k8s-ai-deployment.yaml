apiVersion: apps/v1
kind: Deployment
metadata:
  name: emojudge-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emojudge-ai
  template:
    metadata:
      labels:
        app: emojudge-ai
    spec:
      containers:
        - name: emojudge-ai
          image: sreeja6/emojudge-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000